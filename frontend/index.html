<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim Your NFT</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --accent: #c084fc;
      --accent-hover: #a855f7;
      --text: #e4e4e7;
      --muted: #71717a;
      --success: #22c55e;
      --error: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 480px;
      width: 100%;
      padding: 2rem;
    }

    .card {
      background: var(--card);
      border-radius: 1.5rem;
      padding: 2.5rem;
      text-align: center;
      border: 1px solid rgba(192, 132, 252, 0.1);
    }

    .artwork {
      width: 200px;
      height: 200px;
      border-radius: 1rem;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #7c3aed, #c084fc);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }

    .artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 1rem;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 1rem;
      border-radius: 1rem;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-claim {
      background: var(--accent);
      color: white;
    }

    .btn-claim:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-claim:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-connect {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
    }

    .btn-connect:hover {
      background: rgba(192, 132, 252, 0.1);
    }

    .status {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      display: none;
    }

    .status.success {
      display: block;
      background: rgba(34, 197, 94, 0.1);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .status.loading {
      display: block;
      background: rgba(192, 132, 252, 0.1);
      color: var(--accent);
      border: 1px solid rgba(192, 132, 252, 0.2);
    }

    .inactive-banner {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--error);
      padding: 0.75rem;
      border-radius: 0.75rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .powered-by {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .powered-by a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="artwork" id="artwork">🎵</div>
      <h1 id="dropName">Loading...</h1>
      <p class="subtitle" id="dropDescription">Connect your Universal Profile to claim</p>

      <div class="inactive-banner" id="inactiveBanner" style="display:none">
        Claim is not active right now
      </div>

      <div class="stats">
        <div>
          <div class="stat-label">Claimed</div>
          <div class="stat-value" id="totalClaimed">-</div>
        </div>
        <div>
          <div class="stat-label">Supply</div>
          <div class="stat-value" id="maxSupply">-</div>
        </div>
      </div>

      <button class="btn btn-connect" id="connectBtn" onclick="connectWallet()">
        Connect Universal Profile
      </button>

      <button class="btn btn-claim" id="claimBtn" style="display:none" onclick="claimNFT()">
        Claim NFT
      </button>

      <div class="status" id="status"></div>
    </div>

    <div class="powered-by">
      Powered by <a href="https://lukso.network" target="_blank">LUKSO</a>
    </div>
  </div>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
